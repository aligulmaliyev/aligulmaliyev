<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="Streaks: current 11 days, longest 11 days.">
<title>Streaks: current 11 days, longest 11 days.</title>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace;fill:#23221e}
.mu{fill:#6c685f}.fa{fill:#a8a396}.ac{fill:#c25f3a}.sa{fill:#ad7a35}.sg{fill:#5d7f47}.b{font-weight:700}
.fi{animation:fi .55s ease-out both}
.dr{stroke-dasharray:1;animation:dr 1.3s cubic-bezier(.3,.7,.2,1) both}
@keyframes fi{from{opacity:0}}
@keyframes dr{from{stroke-dashoffset:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rg{animation:rg 1.4s cubic-bezier(.3,.7,.2,1) .35s both}@keyframes rg{from{stroke-dashoffset:1}}</style>
<rect x=".5" y=".5" width="879" height="213" rx="14" fill="#fbfaf6" stroke="#e2ddd0"/>
<text x="28" y="40" font-size="14" class="fi" style="animation-delay:0s"><tspan class="ac">●</tspan> <tspan class="b">Bash</tspan><tspan class="mu">(streak --all-time)</tspan></text>
<text x="34" y="80" font-size="13" class="fa fi">⎿</text>
<text x="852" y="40" font-size="12" text-anchor="end" class="mu fi">first contribution Nov 30, 2019</text>
<path d="M322.5 72v112M587.5 72v112" stroke="#e2ddd0"/>
<g class="fi" style="animation-delay:0.15s"><text x="190" y="126" font-size="30" text-anchor="middle" class="b">1,031</text><text x="190" y="160" font-size="12.5" text-anchor="middle" class="">best year · 2026</text><text x="190" y="181" font-size="11" text-anchor="middle" class="fa">4 commits · 0 PRs</text></g>
<circle cx="455" cy="104" r="30" fill="none" stroke="#e2ddd0" stroke-width="5"/>
<circle class="rg" cx="455" cy="104" r="30" fill="none" stroke="#c25f3a" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" transform="rotate(-90 455 104)"/>
<g class="fi" style="animation-delay:0.25s"><text x="455" y="113" font-size="26" text-anchor="middle" class="b">11</text><text x="455" y="160" font-size="12.5" text-anchor="middle" class="ac b">current streak</text><text x="455" y="181" font-size="11" text-anchor="middle" class="fa">Oct 18 – Oct 28</text></g>
<g class="fi" style="animation-delay:0.35s"><text x="720" y="126" font-size="30" text-anchor="middle" class="b">11<tspan font-size="14" class="mu" dx="3">days</tspan></text><text x="720" y="160" font-size="12.5" text-anchor="middle" class="">longest streak</text><text x="720" y="181" font-size="11" text-anchor="middle" class="fa">Oct 18 – Oct 28</text></g>
</svg>
