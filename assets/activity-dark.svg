<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" role="img" aria-label="Contribution calendar">
<title>Contribution calendar</title>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace;fill:#ece8df}
.mu{fill:#a19c90}.fa{fill:#69655b}.ac{fill:#d97757}.sa{fill:#dcae78}.sg{fill:#97b583}.b{font-weight:700}
.fi{animation:fi .55s ease-out both}
.dr{stroke-dasharray:1;animation:dr 1.3s cubic-bezier(.3,.7,.2,1) both}
@keyframes fi{from{opacity:0}}
@keyframes dr{from{stroke-dashoffset:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="879" height="99" rx="14" fill="#1c1b18" stroke="#36342e"/>
<text x="28" y="40" font-size="14" class="fi" style="animation-delay:0s"><tspan class="ac">●</tspan> <tspan class="b">Fetch</tspan><tspan class="mu">(contribution-calendar --last 52w)</tspan></text>
<text x="34" y="74" font-size="13" class="fa">⎿</text>
<text x="58" y="74" font-size="13" class="mu">waiting for the first run of .github/workflows/profile.yml…</text>
</svg>
