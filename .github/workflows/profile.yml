name: profile cards

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render cards
        run: node scripts/render.mjs
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT with read:user) to count private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "cards unchanged"; exit 0; fi
          git commit -m "chore: refresh profile cards"
          git push
