<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" role="img" aria-label="GitHub stats">
<title>GitHub stats</title>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace;fill:#23221e}
.mu{fill:#6c685f}.fa{fill:#a8a396}.ac{fill:#c25f3a}.sa{fill:#ad7a35}.sg{fill:#5d7f47}.b{font-weight:700}
.fi{animation:fi .55s ease-out both}
.dr{stroke-dasharray:1;animation:dr 1.3s cubic-bezier(.3,.7,.2,1) both}
@keyframes fi{from{opacity:0}}
@keyframes dr{from{stroke-dashoffset:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="879" height="99" rx="14" fill="#fbfaf6" stroke="#e2ddd0"/>
<text x="28" y="40" font-size="14" class="fi" style="animation-delay:0s"><tspan class="ac">●</tspan> <tspan class="b">Bash</tspan><tspan class="mu">(gh stats --since 365d)</tspan></text>
<text x="34" y="74" font-size="13" class="fa">⎿</text>
<text x="58" y="74" font-size="13" class="mu">waiting for the first run of .github/workflows/profile.yml…</text>
</svg>
